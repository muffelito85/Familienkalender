<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Familienkalender</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#2a2622;--muted:#8a8279;--line:#e8e2da;--accent:#d9622b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--card:#262320;--text:#f1ece6;--muted:#9b938a;--line:#38332e;--accent:#f0824d}}
:root[data-theme="dark"]{--bg:#1c1a18;--card:#262320;--text:#f1ece6;--muted:#9b938a;--line:#38332e;--accent:#f0824d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--text);padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.bar button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
.bar b{font-size:17px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:2px solid var(--c);color:var(--text);background:transparent;border-radius:999px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--c);color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:12px;color:var(--muted);text-align:center;padding:4px 0}
.day{aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:14px;color:var(--text)}
.day.out{opacity:.35}.day.today{border-color:var(--accent);font-weight:700}.day.sel{outline:2px solid var(--accent)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:auto}
.dot{width:6px;height:6px;border-radius:50%}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}
.panel h2{font-size:16px;margin:0 0 8px}
.ev{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.ev:first-of-type{border-top:0}
.bar2{width:4px;align-self:stretch;border-radius:2px}
.ev .t{flex:1;min-width:0}.ev small{color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.lh{font-size:13px;color:var(--muted);margin:12px 0 2px;font-weight:600}
.f{display:grid;gap:8px}
.f label{font-size:13px;color:var(--muted);display:block;margin-bottom:2px}
input,select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%;min-width:0}
input[type=checkbox]{width:20px;height:20px;padding:0}
input:disabled{opacity:.4}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.del{background:transparent;color:#d33;border:1px solid var(--line)}
.err{color:#d33;font-size:14px}
</style>
<style>
#authScreen{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}#authCard{background:var(--card);padding:24px;border:1px solid var(--line);border-radius:18px;width:min(100%,400px)}#authCard input{width:100%;margin:6px 0 12px;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}#authCard button,#logoutBtn{padding:11px;border:0;border-radius:8px;background:var(--accent);color:white;cursor:pointer}#authCard button{width:100%;margin:4px 0}#authMessage{white-space:pre-wrap;font-size:13px;color:var(--muted)}#logoutBtn{display:none;font-size:12px;padding:7px 10px;margin-left:8px}
</style>

<style>
#familyNav{display:flex;gap:6px;position:sticky;bottom:0;background:var(--bg);padding:10px 0;z-index:5}
#familyNav button{flex:1;padding:11px 3px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-size:13px}
#familyNav button.active{background:var(--accent);color:#fff}
.familyPage{display:none}.familyPage.active{display:block}
.familyItem{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}
.familyItem span{flex:1;min-width:0;overflow-wrap:anywhere}
.familyItem.done span{text-decoration:line-through;opacity:.6}
.familyItem button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:7px}
.familyForm{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.familyForm input{flex:2;min-width:140px}.familyForm select{flex:1;min-width:110px}
.familyForm button{flex:0 0 auto}
#familyMessage{font-size:13px;min-height:20px}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#d9622b"></head>
<body>
<div class="wrap">
  <div class="top"><h1>👨‍👩‍👧‍👦 Familienkalender</h1>
    <div class="seg"><button id="vm" class="on">Monat</button><button id="vl">Liste</button></div></div>
  <div class="chips" id="chips"></div>
  <div id="monthView">
    <div class="bar"><button id="prev" aria-label="Zurück">‹</button><b id="title"></b><button id="next" aria-label="Weiter">›</button></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="panel" id="dayPanel">
    <h2 id="dayTitle"></h2>
    <div id="list"></div>
    <div class="empty" id="empty">Keine Termine an diesem Tag.</div>
    <button class="btn" id="newBtn" style="width:100%;margin-top:10px">＋ Neuer Termin</button>
  </div>
  <div class="panel" id="listPanel" style="display:none">
    <h2>Die nächsten 60 Tage</h2>
    <div id="agenda"></div>
  </div>
  <div class="panel" id="formPanel" style="display:none">
    <h2 id="formTitle">Neuer Termin</h2>
    <div class="f">
      <input id="et" placeholder="Titel, z. B. Zahnarzt" maxlength="80">
      <div class="chk"><input id="ad" type="checkbox"><label for="ad" style="margin:0;font-size:15px;color:var(--text)">Ganztägig</label></div>
      <div class="row"><div><label for="sd">Beginn</label><input id="sd" type="date"></div><div><label for="st">Uhrzeit</label><input id="st" type="time"></div></div>
      <div class="row"><div><label for="ed">Ende</label><input id="ed" type="date"></div><div><label for="etm">Uhrzeit</label><input id="etm" type="time"></div></div>
      <div><label>Wer? (keine Auswahl = Dani, Caro und Lara)</label><div class="chips" id="fchips" style="margin:4px 0 0"></div></div>
      <div><label for="rep">Wiederholung</label>
        <select id="rep"><option value="none">Keine</option><option value="daily">Täglich</option><option value="weekly">Wöchentlich</option><option value="monthly">Monatlich</option><option value="yearly">Jährlich</option></select></div>
      <div><label for="note">Ort / Notiz (optional)</label><input id="note" maxlength="200"></div>
      <div class="err" id="err"></div>
      <button class="btn" id="save" type="button">Speichern</button>
      <button class="btn sec" id="cancel" type="button">Abbrechen</button>
      <button class="btn del" id="del" type="button" style="display:none">Termin löschen</button>
    </div>
  </div>

<section id="familyTasks" class="familyPage panel" aria-label="Aufgaben">
 <h2>Gemeinsame Aufgaben</h2>
 <form id="taskForm" class="familyForm">
  <input id="taskTitle" maxlength="160" placeholder="Neue Aufgabe" required>
  <select id="taskAssignee" aria-label="Zuständig"><option value="">Alle</option><option value="daniel">Dani</option><option value="caro">Caro</option><option value="lara">Lara</option><option value="mila">Mila</option></select>
  <input id="taskDue" type="date" aria-label="Fällig am">
  <button class="btn" type="submit">Hinzufügen</button>
 </form>
 <div id="taskList"></div>
</section>
<section id="familyShopping" class="familyPage panel" aria-label="Einkauf">
 <h2>Einkaufsliste</h2>
 <form id="shoppingForm" class="familyForm">
  <input id="shoppingTitle" maxlength="160" placeholder="Artikel" required>
  <input id="shoppingQuantity" maxlength="60" placeholder="Menge (optional)">
  <button class="btn" type="submit">Hinzufügen</button>
 </form>
 <div id="shoppingList"></div>
</section>
<section id="familyMore" class="familyPage panel" aria-label="Mehr">
 <h2>Geburtstage &amp; Jahrestage</h2>
 <form id="anniversaryForm" class="familyForm">
  <input id="anniversaryTitle" maxlength="160" placeholder="Name / Anlass" required>
  <select id="anniversaryKind"><option value="birthday">Geburtstag</option><option value="anniversary">Jahrestag</option></select>
  <input id="anniversaryDate" type="date" required>
  <button class="btn" type="submit">Hinzufügen</button>
 </form>
 <div id="anniversaryList"></div>
 <h2 style="margin-top:22px">Darstellung</h2>
 <label for="familyTheme">Design</label>
 <select id="familyTheme"><option value="system">System</option><option value="light">Hell</option><option value="dark">Dunkel</option></select>
 <label for="familyAccent">Akzentfarbe</label>
 <input id="familyAccent" type="color" value="#d9622b" style="height:46px">
 <button id="savePrefs" class="btn" type="button" style="margin-top:8px">Einstellungen speichern</button>
</section>
<p id="familyMessage" role="status" aria-live="polite"></p>
<nav id="familyNav" aria-label="Bereiche">
 <button type="button" data-page="calendar" class="active">Kalender</button>
 <button type="button" data-page="tasks">Aufgaben</button>
 <button type="button" data-page="shopping">Einkauf</button>
 <button type="button" data-page="more">Mehr</button>
</nav>
  <button id="logoutBtn" type="button">Abmelden</button><p class="empty" id="status" style="text-align:center"></p>
</div>
<div id="authScreen"><div id="authCard"><h2>Familienkalender</h2><p>Mit deiner E-Mail anmelden. Neue Konten müssen anschließend für die Familie freigeschaltet werden.</p><input id="authEmail" type="email" placeholder="E-Mail" autocomplete="email"><input id="authPassword" type="password" placeholder="Passwort (mind. 6 Zeichen)" autocomplete="current-password"><button id="loginBtn">Anmelden</button><button id="registerBtn" style="background:#777">Konto erstellen</button><p id="authMessage" role="status"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
var MEMBERS=[{id:"daniel",name:"Dani",color:"#3b82f6"},{id:"caro",name:"Caro",color:"#22a06b"},{id:"lara",name:"Lara",color:"#e0559a"},{id:"mila",name:"Mila 🐕",color:"#f59e0b",pet:true}];
var FAM=MEMBERS.filter(function(m){return !m.pet}).map(function(m){return m.id});
function isFam(ms){return ms.length===FAM.length&&FAM.every(function(f){return ms.indexOf(f)>=0});}
var state={events:[]},store=null,status="",editId=null,fm={},mode="month",filter={};
var today=new Date(),view=new Date(today.getFullYear(),today.getMonth(),1);
function $(i){return document.getElementById(i);}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dn(k){var p=k.split("-");return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000);}
function fromDn(n){var d=new Date(n*86400000);return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");}
function mem(id){return MEMBERS.find(function(m){return m.id===id})||{name:"?",color:"#999"};}
var sel=iso(today);
function norm(e){
  var o={id:e.id,title:e.title||"",start:e.start||e.date||iso(today),end:e.end||e.start||e.date||iso(today),allDay:!!e.allDay,st:e.st!==undefined?e.st:(e.time||""),et:e.et||"",ms:e.ms||(e.m?[e.m]:[]),rep:e.rep||"none",note:e.note||""};
  if(!o.ms.length)o.ms=FAM.slice();
  return o;
}
function occ(e,k){
  var D=dn(e.end)-dn(e.start),kn=dn(k),s=dn(e.start),r=e.rep||"none";
  for(var o=0;o<=D;o++){
    var c=kn-o;if(c<s)continue;
    if(r==="none"){if(c===s)return true;continue;}
    if(r==="daily")return true;
    if(r==="weekly"&&(c-s)%7===0)return true;
    var cd=new Date(c*86400000),sd=new Date(s*86400000);
    if(r==="monthly"&&cd.getUTCDate()===sd.getUTCDate())return true;
    if(r==="yearly"&&cd.getUTCDate()===sd.getUTCDate()&&cd.getUTCMonth()===sd.getUTCMonth())return true;
  }
  return false;
}
function shown(e){return e.ms.some(function(m){return filter[m]!==false});}
function evs(k){
  return state.events.map(norm).filter(function(e){return shown(e)&&occ(e,k)}).sort(function(a,b){
    if(a.allDay!==b.allDay)return a.allDay?-1:1;return (a.st||"").localeCompare(b.st||"");});
}
function fmtD(k){var p=k.split("-");return p[2]+"."+p[1]+".";}
function timeLabel(e){
  var t=e.allDay?"Ganztägig":(e.st?e.st+(e.et?"–"+e.et:"")+" Uhr":"");
  if(e.end!==e.start)t+=(t?" · ":"")+fmtD(e.start)+"–"+fmtD(e.end);
  return t;
}
var REP={daily:"täglich",weekly:"wöchentlich",monthly:"monatlich",yearly:"jährlich"};
function evRow(e){
  var r=document.createElement("div");r.className="ev";
  var bar=document.createElement("div");bar.className="bar2";
  var cs=e.ms.map(function(m){return mem(m).color});
  bar.style.background=cs.length>1?"linear-gradient(180deg,"+cs.join(",")+")":cs[0];
  var t=document.createElement("div");t.className="t";
  var b=document.createElement("b");b.textContent=e.title;
  var sm=document.createElement("small");
  var parts=[timeLabel(e),isFam(e.ms)?"Familie":e.ms.map(function(m){return mem(m).name}).join(", ")];
  if(e.rep!=="none")parts.push("↻ "+REP[e.rep]);
  if(e.note)parts.push(e.note);
  sm.textContent=parts.filter(Boolean).join(" · ");
  t.appendChild(b);t.appendChild(document.createElement("br"));t.appendChild(sm);
  r.appendChild(bar);r.appendChild(t);
  r.onclick=function(){openForm(e);};
  return r;
}
function chipSet(box,onclick,isOn){
  box.innerHTML="";
  MEMBERS.forEach(function(m){
    var b=document.createElement("button");b.type="button";b.className="chip"+(isOn(m.id)?" on":"");b.style.setProperty("--c",m.color);b.textContent=m.name;
    b.onclick=function(){onclick(m.id);};box.appendChild(b);
  });
}
function render(){
  if(typeof familyPage!=='undefined' && familyPage!=='calendar')return;
  $("status").textContent=status;
  chipSet($("chips"),function(id){filter[id]=(filter[id]===false);render();},function(id){return filter[id]!==false;});
  chipSet($("fchips"),function(id){fm[id]=!fm[id];render();},function(id){return !!fm[id];});
  $("vm").className=mode==="month"?"on":"";$("vl").className=mode==="list"?"on":"";
  $("monthView").style.display=mode==="month"?"block":"none";
  var formOpen=$("formPanel").style.display!=="none";
  $("dayPanel").style.display=(mode==="month"&&!formOpen)?"block":"none";
  $("listPanel").style.display=(mode==="list"&&!formOpen)?"block":"none";
  if(mode==="month")renderMonth();else renderAgenda();
}
function renderMonth(){
  $("title").textContent=view.toLocaleDateString("de-DE",{month:"long",year:"numeric"});
  var g=$("grid");g.innerHTML="";
  ["Mo","Di","Mi","Do","Fr","Sa","So"].forEach(function(d){var e=document.createElement("div");e.className="dow";e.textContent=d;g.appendChild(e);});
  var off=(view.getDay()+6)%7,start=new Date(view.getFullYear(),view.getMonth(),1-off);
  for(var i=0;i<42;i++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=iso(d);
    var c=document.createElement("button");
    c.className="day"+(d.getMonth()!==view.getMonth()?" out":"")+(k===iso(today)?" today":"")+(k===sel?" sel":"");
    var sp=document.createElement("span");sp.textContent=d.getDate();c.appendChild(sp);
    var dots=document.createElement("div");dots.className="dots";var n=0;
    evs(k).forEach(function(ev){ev.ms.forEach(function(m){if(n<6&&filter[m]!==false){n++;var o=document.createElement("i");o.className="dot";o.style.background=mem(m).color;dots.appendChild(o);}});});
    c.appendChild(dots);
    (function(k){c.onclick=function(){sel=k;render();};})(k);
    g.appendChild(c);
  }
  $("dayTitle").textContent=new Date(sel+"T00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  var l=$("list");l.innerHTML="";var list=evs(sel);
  $("empty").style.display=list.length?"none":"block";
  list.forEach(function(e){l.appendChild(evRow(e));});
}
function renderAgenda(){
  var a=$("agenda");a.innerHTML="";var any=false,s=dn(iso(today));
  for(var i=0;i<60;i++){
    var k=fromDn(s+i),list=evs(k);if(!list.length)continue;any=true;
    var h=document.createElement("div");h.className="lh";
    h.textContent=new Date(k+"T00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
    a.appendChild(h);list.forEach(function(e){a.appendChild(evRow(e));});
  }
  if(!any){var e=document.createElement("div");e.className="empty";e.textContent="Keine anstehenden Termine.";a.appendChild(e);}
}
function openForm(e){
  editId=e?e.id:null;
  $("formTitle").textContent=e?"Termin bearbeiten":"Neuer Termin";
  var v=e||{title:"",start:sel,end:sel,allDay:false,st:"",et:"",ms:[],rep:"none",note:""};
  $("et").value=v.title;$("ad").checked=v.allDay;$("sd").value=v.start;$("ed").value=v.end;
  $("st").value=v.st;$("etm").value=v.et;$("rep").value=v.rep;$("note").value=v.note;
  fm={};(e&&!isFam(e.ms)?e.ms:[]).forEach(function(m){fm[m]=true;});
  $("del").style.display=e?"block":"none";$("err").textContent="";
  syncAD();$("formPanel").style.display="block";$("dayPanel").style.display="none";$("listPanel").style.display="none";
  render();$("formPanel").scrollIntoView({block:"start"});
}
function closeForm(){$("formPanel").style.display="none";editId=null;render();}
function syncAD(){var a=$("ad").checked;$("st").disabled=a;$("etm").disabled=a;}
function plus1(t){var p=t.split(":"),h=Math.min(+p[0]+1,23);return String(h).padStart(2,"0")+":"+(+p[0]+1>23?"59":p[1]);}
$("ad").onchange=syncAD;
$("sd").onchange=function(){if(!$("ed").value||$("ed").value<$("sd").value)$("ed").value=$("sd").value;};
$("st").onchange=function(){if($("st").value&&$("sd").value===$("ed").value&&(!$("etm").value||$("etm").value<=$("st").value))$("etm").value=plus1($("st").value);};
$("newBtn").onclick=function(){openForm(null);};
$("cancel").onclick=closeForm;
$("save").onclick=function(){
  var t=$("et").value.trim(),sd=$("sd").value,ed=$("ed").value||sd,ad=$("ad").checked,st=ad?"":$("st").value,et=ad?"":$("etm").value;
  if(!t){$("err").textContent="Bitte einen Titel eingeben.";return;}
  if(!sd){$("err").textContent="Bitte ein Startdatum wählen.";return;}
  if(ed<sd){$("err").textContent="Das Ende liegt vor dem Beginn.";return;}
  if(!ad&&ed===sd&&st&&et&&et<st){$("err").textContent="Die Endzeit liegt vor der Startzeit.";return;}
  var ms=MEMBERS.map(function(m){return m.id}).filter(function(m){return fm[m]});
  if(!ms.length)ms=FAM.slice();
  var o={title:t,start:sd,end:ed,allDay:ad,st:st,et:et,ms:ms,rep:$("rep").value,note:$("note").value.trim()};
  if(store){if(editId)store.update(editId,o);else store.add(o);}
  sel=sd;view=new Date(+sd.slice(0,4),+sd.slice(5,7)-1,1);closeForm();
};
$("del").onclick=function(){if(store&&editId)store.del(editId);closeForm();};
$("prev").onclick=function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);render();};
$("next").onclick=function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);render();};
$("vm").onclick=function(){mode="month";render();};
$("vl").onclick=function(){mode="list";render();};

// Supabase persistence. Never use a service_role key in a client app.
var sb=null, channel=null, poller=null, sessionUser=null;
var familyId=window.FAMCAL_CONFIG && window.FAMCAL_CONFIG.familyId;
var config=window.FAMCAL_CONFIG||{};
var fields=['title','start','end','allDay','st','et','ms','rep','note'];
function record(e){var x={family_id:familyId};fields.forEach(function(k){x[k]=e[k]});return x;}
function msg(e){return e&&e.message?e.message:String(e||'Unbekannter Fehler');}
function authMessage(t){$('authMessage').textContent=t;}
function locked(t){store=null;state.events=[];status=t||'Bitte anmelden';$('authScreen').style.display='flex';$('logoutBtn').style.display='none';render();}
async function refresh(){
  if(!sessionUser)return;
  var result=await sb.from('events').select('id,title,start,end,allDay,st,et,ms,rep,note').eq('family_id',familyId).order('start',{ascending:true}).limit(5000);
  if(result.error){status='Synchronisierung fehlgeschlagen: '+msg(result.error);render();return;}
  state.events=result.data||[];status='Synchronisiert';render();
}
async function write(kind,id,ev){
  $('save').disabled=true;$('del').disabled=true;
  try{
    var q=kind==='add'?sb.from('events').insert(record(ev)):
      kind==='update'?sb.from('events').update(record(ev)).eq('id',id).eq('family_id',familyId):
      sb.from('events').delete().eq('id',id).eq('family_id',familyId);
    var r=await q.select('id');
    if(r.error)throw r.error;
    if(kind!=='add'&&(!r.data||!r.data.length))throw new Error('Termin nicht gefunden oder keine Berechtigung.');
    await refresh();return true;
  }catch(e){$('err').textContent='Speichern fehlgeschlagen: '+msg(e);status='Fehler beim Speichern';render();return false;}
  finally{$('save').disabled=false;$('del').disabled=false;}
}
async function enter(){
  var r=await sb.auth.getUser();sessionUser=r.data&&r.data.user;
  if(!sessionUser){locked();return;}
  var m=await sb.from('family_members').select('family_id').eq('family_id',familyId).eq('user_id',sessionUser.id).maybeSingle();
  if(m.error||!m.data){locked('Konto noch nicht für die Familie freigeschaltet');authMessage('Angemeldet als '+sessionUser.email+'. Der Administrator muss deine Benutzer-ID in family_members freischalten: '+sessionUser.id);return;}
  $('authScreen').style.display='none';$('logoutBtn').style.display='inline-block';
  store={add:function(e){return write('add',null,e)},update:function(id,e){return write('update',id,e)},del:function(id){return write('delete',id,null)}};
  if(channel)await sb.removeChannel(channel);
  channel=sb.channel('family-events-'+familyId).on('postgres_changes',{event:'*',schema:'public',table:'events',filter:'family_id=eq.'+familyId},function(){refresh()}).subscribe();
  if(poller)clearInterval(poller);poller=setInterval(function(){if(!document.hidden)refresh()},30000);
  await refresh();
}
async function setup(){
  if(!config.url||!config.anonKey||!familyId||config.url.includes('YOUR_')||config.anonKey.includes('YOUR_')){
    locked('Supabase noch nicht konfiguriert');authMessage('Bitte config.js mit Supabase URL, anon/publishable Key und familyId ausfüllen.');$('loginBtn').disabled=true;$('registerBtn').disabled=true;return;
  }
  if(!window.supabase){locked('Supabase-Bibliothek konnte nicht geladen werden. Internetverbindung prüfen.');return;}
  sb=window.supabase.createClient(config.url,config.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(function(event){if(event==='SIGNED_OUT'){sessionUser=null;if(channel){sb.removeChannel(channel);channel=null}if(poller)clearInterval(poller);locked();}});
  $('loginBtn').onclick=async function(){authMessage('Anmeldung läuft …');var r=await sb.auth.signInWithPassword({email:$('authEmail').value.trim(),password:$('authPassword').value});if(r.error){authMessage(msg(r.error));return;}await enter();};
  $('registerBtn').onclick=async function(){authMessage('Registrierung läuft …');var r=await sb.auth.signUp({email:$('authEmail').value.trim(),password:$('authPassword').value});if(r.error){authMessage(msg(r.error));return;}authMessage('Konto erstellt. Bitte ggf. E-Mail bestätigen. Anschließend muss der Administrator deine Benutzer-ID freischalten.');if(r.data.session)await enter();};
  $('logoutBtn').onclick=async function(){await sb.auth.signOut();};
  await enter();
}
// Keep form visible on failed writes; do not claim a save succeeded prematurely.
$('save').onclick=async function(){
  var t=$('et').value.trim(),sd=$('sd').value,ed=$('ed').value||sd,ad=$('ad').checked,st=ad?'':$('st').value,et=ad?'':$('etm').value;
  if(!t){$('err').textContent='Bitte einen Titel eingeben.';return;}
  if(!sd){$('err').textContent='Bitte ein Startdatum wählen.';return;}
  if(ed<sd){$('err').textContent='Das Ende liegt vor dem Beginn.';return;}
  if(!ad&&ed===sd&&st&&et&&et<st){$('err').textContent='Die Endzeit liegt vor der Startzeit.';return;}
  var ms=MEMBERS.map(function(m){return m.id}).filter(function(m){return fm[m]});if(!ms.length)ms=FAM.slice();
  var o={title:t,start:sd,end:ed,allDay:ad,st:st,et:et,ms:ms,rep:$('rep').value,note:$('note').value.trim()};
  if(!store){$('err').textContent='Bitte zuerst anmelden.';return;}
  var ok=editId?await store.update(editId,o):await store.add(o);
  if(ok){sel=sd;view=new Date(+sd.slice(0,4),+sd.slice(5,7)-1,1);closeForm();}
};
$('del').onclick=async function(){if(store&&editId&&confirm('Termin wirklich löschen?')){if(await store.del(editId))closeForm();}};

// Phase 1: Shared tasks, shopping list, anniversaries and per-user preferences.
var familyData={tasks:[],shopping_items:[],anniversaries:[]}, familyPage='calendar';
var familyChannels=[], familyRefreshTimer=null;
function familyNotice(message){$('familyMessage').textContent=message||'';}
function familySwitch(page){
 familyPage=page;
 var cal=page==='calendar';
 ['monthView','dayPanel','listPanel','formPanel','chips'].forEach(function(id){$(id).style.display=cal?'':'none';});
 document.querySelector('.top .seg').style.display=cal?'':'none';
 ['familyTasks','familyShopping','familyMore'].forEach(function(id){$(id).classList.toggle('active',id==='family'+page.charAt(0).toUpperCase()+page.slice(1));});
 document.querySelectorAll('#familyNav button').forEach(function(b){b.classList.toggle('active',b.dataset.page===page);});
 if(cal)render();
}
document.querySelectorAll('#familyNav button').forEach(function(b){b.onclick=function(){familySwitch(b.dataset.page);};});
function familyElement(tag,content,cls){
 var e=document.createElement(tag);if(content!==undefined)e.textContent=content;if(cls)e.className=cls;return e;
}
function familyDraw(table){
 var root=$(table==='tasks'?'taskList':table==='shopping_items'?'shoppingList':'anniversaryList');
 root.replaceChildren();
 var rows=familyData[table]||[];
 if(!rows.length){root.appendChild(familyElement('p','Noch keine Einträge.','empty'));return;}
 rows.forEach(function(item){
  var row=familyElement('div',undefined,'familyItem'+(item.completed?' done':''));
  if(table!=='anniversaries'){
   var check=document.createElement('input');check.type='checkbox';check.checked=!!item.completed;
   check.setAttribute('aria-label','Erledigt: '+item.title);
   check.onchange=async function(){await familyMutate(table,'update',{completed:check.checked},item.id);};
   row.appendChild(check);
  }
  var detail=item.title;
  if(table==='tasks')detail+=(item.assigned_to?' · '+({daniel:'Dani',caro:'Caro',lara:'Lara',mila:'Mila'}[item.assigned_to]||item.assigned_to):'')+(item.due_date?' · '+item.due_date:'');
  if(table==='shopping_items'&&item.quantity)detail+=' · '+item.quantity;
  if(table==='anniversaries')detail+=' · '+(item.kind==='birthday'?'Geburtstag':'Jahrestag')+' · '+item.event_date.slice(8,10)+'.'+item.event_date.slice(5,7)+'.';
  row.appendChild(familyElement('span',detail));
  var del=familyElement('button','✕');del.type='button';del.setAttribute('aria-label','Eintrag löschen');
  del.onclick=async function(){if(confirm('Eintrag wirklich löschen?'))await familyMutate(table,'delete',null,item.id);};
  row.appendChild(del);root.appendChild(row);
 });
}
async function familyLoad(){
 if(!sb||!sessionUser)return;
 var tables=['tasks','shopping_items','anniversaries'];
 var responses=await Promise.all(tables.map(function(t){return sb.from(t).select('*').eq('family_id',familyId).order('created_at',{ascending:false}).limit(1000);}));
 responses.forEach(function(r,i){if(r.error){familyNotice('Laden fehlgeschlagen ('+tables[i]+'): '+msg(r.error));return;}familyData[tables[i]]=r.data||[];familyDraw(tables[i]);});
}
async function familyMutate(table,action,data,id){
 if(!sb||!sessionUser){familyNotice('Bitte anmelden.');return;}
 familyNotice('Speichern …');
 try{
  var q=action==='insert'?sb.from(table).insert(Object.assign({family_id:familyId},data)):
   action==='update'?sb.from(table).update(data).eq('id',id).eq('family_id',familyId):
   sb.from(table).delete().eq('id',id).eq('family_id',familyId);
  var r=await q.select('id');if(r.error)throw r.error;
  if(action!=='insert'&&(!r.data||!r.data.length))throw new Error('Eintrag nicht gefunden oder keine Berechtigung.');
  familyNotice('Gespeichert');await familyLoad();
 }catch(e){familyNotice('Fehler: '+msg(e));}
}
$('taskForm').onsubmit=function(e){
 e.preventDefault();var title=$('taskTitle').value.trim();if(!title)return;
 familyMutate('tasks','insert',{title:title,assigned_to:$('taskAssignee').value||null,due_date:$('taskDue').value||null}).then(function(){});$('taskTitle').value='';
};
$('shoppingForm').onsubmit=function(e){
 e.preventDefault();var title=$('shoppingTitle').value.trim();if(!title)return;
 familyMutate('shopping_items','insert',{title:title,quantity:$('shoppingQuantity').value.trim()});$('shoppingTitle').value='';$('shoppingQuantity').value='';
};
$('anniversaryForm').onsubmit=function(e){
 e.preventDefault();var title=$('anniversaryTitle').value.trim(),date=$('anniversaryDate').value;if(!title||!date)return;
 familyMutate('anniversaries','insert',{title:title,kind:$('anniversaryKind').value,event_date:date});$('anniversaryTitle').value='';
};
function applyFamilyPrefs(p){
 $('familyTheme').value=p.theme||'system';$('familyAccent').value=p.accent_color||'#d9622b';
 if(p.theme==='system')document.documentElement.removeAttribute('data-theme');
 else document.documentElement.setAttribute('data-theme',p.theme);
 document.documentElement.style.setProperty('--accent',p.accent_color||'#d9622b');
}
async function loadFamilyPrefs(){
 var r=await sb.from('user_preferences').select('theme,accent_color').eq('family_id',familyId).eq('user_id',sessionUser.id).maybeSingle();
 if(!r.error&&r.data)applyFamilyPrefs(r.data);
}
$('savePrefs').onclick=async function(){
 if(!sessionUser)return;
 var data={family_id:familyId,user_id:sessionUser.id,theme:$('familyTheme').value,accent_color:$('familyAccent').value,updated_at:new Date().toISOString()};
 var r=await sb.from('user_preferences').upsert(data,{onConflict:'family_id,user_id'});
 if(r.error)familyNotice('Fehler: '+msg(r.error));else{applyFamilyPrefs(data);familyNotice('Einstellungen gespeichert');}
};
var originalFamilyEnter=enter;
enter=async function(){
 await originalFamilyEnter();
 if(!sessionUser||$('authScreen').style.display!=='none')return;
 await Promise.all([familyLoad(),loadFamilyPrefs()]);
 familyChannels.forEach(function(c){sb.removeChannel(c);});familyChannels=[];
 ['tasks','shopping_items','anniversaries'].forEach(function(table){
  familyChannels.push(sb.channel('family-'+table+'-'+familyId).on('postgres_changes',{event:'*',schema:'public',table:table,filter:'family_id=eq.'+familyId},familyLoad).subscribe());
 });
 if(familyRefreshTimer)clearInterval(familyRefreshTimer);
 familyRefreshTimer=setInterval(function(){if(!document.hidden&&sessionUser)familyLoad();},30000);
};
var originalFamilyLocked=locked;
locked=function(message){
 familyChannels.forEach(function(c){if(sb)sb.removeChannel(c);});familyChannels=[];
 if(familyRefreshTimer)clearInterval(familyRefreshTimer);familyRefreshTimer=null;
 originalFamilyLocked(message);
};

locked('Bitte anmelden');setup();
</script>
